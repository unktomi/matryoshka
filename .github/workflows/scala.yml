name: Scala 3
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: ['testsJVM/test', 'testsJS/test', 'docs/mdoc']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: sbt/setup-sbt@v1
      - run: sbt "${{ matrix.task }}"
